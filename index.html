<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E6EBF0" />
    <script>
      // Pick the theme before first paint, so a dark-mode visitor never sees a flash of paper.
      try {
        var saved = localStorage.getItem('sidetracked-theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
    <title>SideTracked</title>
    <meta
      name="description"
      content="One thing leads to another. Explore Wikipedia as a living map of connected ideas and keep the trail you leave."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SideTracked" />
    <meta property="og:description" content="One thing leads to another. Follow any topic outward through a map of connected ideas." />
    <meta property="og:url" content="https://side-tracked.vercel.app/" />
    <meta property="og:image" content="https://side-tracked.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SideTracked: five topic notes pinned along a red thread under the headline One thing leads to another." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://side-tracked.vercel.app/og.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
